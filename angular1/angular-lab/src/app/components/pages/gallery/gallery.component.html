<h1>Gallery</h1>

<div class="gallery-container">

  <!-- Imagen seleccionada en grande -->
  <div class="selected-image">
    <img [src]="selectedImage.src" [alt]="selectedImage.title" [style.width.px]="imageSize">
  </div>

  <!-- Lista de imágenes en pequeño -->
  <div class="image-list">
    @for (image of images; track image.id) {
      <img [src]="image.src" [alt]="image.title" (click)="selectImage($index)" />
    }
  </div>

  <!-- Botonera -->
  <div class="controls">
    <button mat-raised-button (click)="prev()" [disabled]="selectedIndex === 0">Anterior</button>
    <button mat-raised-button (click)="next()" [disabled]="selectedIndex === images.length - 1">Siguiente</button>
    <button mat-raised-button (click)="increase()">Aumentar</button>
    <button mat-raised-button (click)="decrease()">Disminuir</button>
    @if (!isPlaying()) {
      <button mat-raised-button color="primary" (click)="play()">Play</button>
    }
    @if (isPlaying()) {
      <button mat-raised-button color="warn" (click)="stop()">Stop</button>
    }
  </div>

</div>
